name: Deploy website

# 推送到 main 时构建插件文档并发布 website/ 到 GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'plugin-docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin-docs/package-lock.json

      # wiki 是构建产物，不提交到仓库；每次部署前从 plugin-docs 重新生成。
      - name: Build plugin docs
        working-directory: plugin-docs
        run: |
          npm ci
          npm run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
